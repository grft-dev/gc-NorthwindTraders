name: northwind-graft

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: northwind-graft-sqlserver
    ports:
      - "1438:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - MSSQL_SA_PASSWORD=8jkGh47hnDw89H@q8LN2
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"8jkGh47hnDw89H@q8LN2\" -C -Q \"SELECT 1\" || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20

  db-seed:
    image: mcr.microsoft.com/mssql-tools
    container_name: northwind-graft-db-seed
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./db/seed.sql:/seed.sql:ro
    environment:
      - SQLCMDPASSWORD=8jkGh47hnDw89H@q8LN2
    entrypoint: ["/opt/mssql-tools/bin/sqlcmd", "-b", "-S", "sqlserver", "-U", "sa", "-i", "/seed.sql"]
    restart: "no"

  northwind-grafthost:
    image: northwind/grafthost:1.0
    build:
      context: .
      dockerfile: Northwind.GraftHost/Dockerfile
    depends_on:
      db-seed:
        condition: service_completed_successfully
    ports:
      - "8096:80"
      - "8097:81"
    environment:
      - NORTHWIND_DB_CONNECTION_STRING=Server=sqlserver,1433;User Id=sa;Password=8jkGh47hnDw89H@q8LN2;Database=Northwind;TrustServerCertificate=true;Encrypt=False
